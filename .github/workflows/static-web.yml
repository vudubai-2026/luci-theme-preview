          <script>
          const $ = s => document.querySelector(s);
          const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          const LBL = {all:'Tất cả',desktop:'Desktop',mobile:'Mobile',light:'Sáng',dark:'Tối'};
          let M = null, data = [], list = [], cur = null, compareMode = false;
          const F = {theme:'', device:'desktop', scheme:'light', group:'all', q:'', bad:false};

          fetch('manifest.json').then(r => r.json()).then(d => {
            M = d; data = d.items; F.theme = (d.meta.themes[0] || {}).name || '';
            head(d); init(); initSandbox(d);
          });

          function head(d) {
            const m = d.meta, s = d.summary;
            $('#title').textContent = (m.title || m.name || m.repo) + ' — Preview V2.6';
            $('#meta').innerHTML = `<a href="https://github.com/${esc(m.repo)}" target="_blank">${esc(m.repo)}</a> · Giả lập <b>${esc(m.model)}</b> · Size: <b>${m.assetSizeKB} KB</b> · Load TB: <b>${m.avgLoadMs} ms</b>`;
            $('#sum').innerHTML = `${s.total} ảnh Retina 2x · <span class="e">${s.errors} lỗi</span> · <span class="w">${s.warns} cảnh báo</span> · ${new Date(m.generated).toLocaleString('vi-VN')}`;
          }
          function seg(el, key, vals, onPick) {
            el.innerHTML = vals.map(v => `<button data-v="${v}" class="${F[key]===v?'on':''}">${LBL[v]||v}</button>`).join('');
            el.onclick = e => { const v = e.target.dataset.v; if (v) { F[key] = v; onPick(); } };
          }
          function init() {
            const groups = ['all', ...new Set(data.map(x => x.group))];
            const themes = M.meta.themes.map(t => t.name);
            const draw = () => {
              $('#fTheme').innerHTML = themes.length > 1 ? themes.map(t => `<button class="chip ${F.theme===t?'on':''}" data-t="${t}">${esc(t)}</button>`).join('') : '';
              seg($('#fDevice'), 'device', ['all','desktop','mobile'], draw);
              seg($('#fScheme'), 'scheme', ['all','light','dark'], draw);
              $('#fGroup').innerHTML = groups.map(g => `<button class="chip ${F.group===g?'on':''}" data-g="${g}">${g==='all'?'Tất cả nhóm':g}</button>`).join('');
              $('#fBad').classList.toggle('on', F.bad);
              render();
            };
            $('#fTheme').onclick = e => { if (e.target.dataset.t) { F.theme = e.target.dataset.t; draw(); } };
            $('#fGroup').onclick = e => { if (e.target.dataset.g) { F.group = e.target.dataset.g; draw(); } };
            $('#fBad').onclick = () => { F.bad = !F.bad; draw(); };
            $('#q').oninput = e => { F.q = e.target.value.toLowerCase(); render(); };
            draw();
          }
          const worst = x => x.issues.some(i => i.l==='e') ? 'e' : x.issues.length ? 'w' : '';
          function render() {
            list = data.filter(x => (!F.theme || x.theme===F.theme) && (F.device==='all'||x.device===F.device) && (F.scheme==='all'||x.scheme===F.scheme) && (F.group==='all'||x.group===F.group) && (!F.bad || x.issues.length) && (!F.q || (x.title+' '+x.id).toLowerCase().includes(F.q)));
            const by = {};
            list.forEach(x => (by[x.group] = by[x.group] || []).push(x));
            $('#main').innerHTML = Object.entries(by).map(([g, items]) => `<h2>${esc(g)}</h2><div class="grid">` + items.map(x => {
              const i = data.indexOf(x), w = worst(x);
              const mark = w ? ` <span class="${w}">${w==='e'?'✖':'⚠'}</span>` : '';
              return `<div class="card" data-i="${i}"><img loading="lazy" src="${x.thumb}"><div class="meta"><span>${esc(x.title)}${mark}</span><small>${x.device} · ${x.scheme} · ${x.loadMs}ms</small></div></div>`;
            }).join('') + '</div>').join('') || '<p>Không có ảnh.</p>';
          }
          $('#main').onclick = e => { const c = e.target.closest('.card'); if (c) open(data[+c.dataset.i]); };
          function variant(x, k, v) { return data.find(y => y.theme===x.theme && y.id===x.id && y.device===(k==='device'?v:x.device) && y.scheme===(k==='scheme'?v:x.scheme)); }
          function open(x) {
            cur = x; $('#lb').classList.add('open'); $('#lbpic').src = x.full;
            const opp = variant(x, 'scheme', x.scheme === 'light' ? 'dark' : 'light');
            if (compareMode && opp) { $('#lbpic2').src = opp.full; $('#lbpic2').style.display = 'block'; $('#lbimg').classList.add('compare'); }
            else { $('#lbpic2').style.display = 'none'; $('#lbimg').classList.remove('compare'); }
            $('#cmpBtn').classList.toggle('active', compareMode);
            $('#lbtitle').textContent = x.title;
            const arr = list.includes(x) ? list : data;
            $('#lbpos').textContent = `${arr.indexOf(x)+1}/${arr.length}`;
            $('#dl').href = x.full;
            const bad = $('#lbissue');
            bad.style.display = x.issues.length ? 'block' : 'none';
            bad.innerHTML = x.issues.map(it => `<div class="${it.l}">${it.l==='e'?'✖':'⚠'} ${esc(it.t)}</div>`).join('');
            const btns = (el, k, vals) => {
              el.innerHTML = vals.map(v => `<button data-v="${v}" class="${x[k]===v?'on':''}">${LBL[v]}</button>`).join('');
              el.onclick = e => { const v = e.target.dataset.v; if (v) { const t = variant(x, k, v); if (t) open(t); } };
            };
            btns($('#vDevice'), 'device', ['desktop','mobile']); btns($('#vScheme'), 'scheme', ['light','dark']);
          }
          function close() { $('#lb').classList.remove('open'); }
          function nav(d) { const arr = list.includes(cur) ? list : data; open(arr[(arr.indexOf(cur) + d + arr.length) % arr.length]); }
          function toggleCompare() { compareMode = !compareMode; if (cur) open(cur); }
          $('#close').onclick = close; $('#prev').onclick = () => nav(-1); $('#next').onclick = () => nav(1);
          $('#cmpBtn').onclick = toggleCompare; $('#fit').onclick = () => $('#lbimg').classList.toggle('actual');
          function initSandbox(d) {
            const pages = d.meta.sandboxPages || [];
            if (!pages.length) { $('#openSandbox').style.display = 'none'; return; }
            const sel = $('#sbPageSelect');
            sel.innerHTML = pages.map(p => `<option value="${p}">Trang: ${p.toUpperCase()}</option>`).join('');
            sel.onchange = () => { $('#sbFrame').src = 'sandbox/' + sel.value + '.html'; };
            $('#openSandbox').onclick = () => {
              $('#sbModal').classList.add('open');
              const def = pages.includes('overview') ? 'overview' : pages[0];
              if ($('#sbFrame').src === 'about:blank') { sel.value = def; $('#sbFrame').src = 'sandbox/' + def + '.html'; }
            };
            $('#closeSb').onclick = () => $('#sbModal').classList.remove('open');
            $('#sbDesktop').onclick = () => { $('#sbFrame').classList.remove('mobile'); $('#sbDesktop').classList.add('active'); $('#sbMobile').classList.remove('active'); };
            $('#sbMobile').onclick = () => { $('#sbFrame').classList.add('mobile'); $('#sbMobile').classList.add('active'); $('#sbDesktop').classList.remove('active'); };
            $('#sbLight').onclick = () => { $('#sbFrame').contentWindow.postMessage({ type: 'set-scheme', scheme: 'light' }, '*'); $('#sbLight').classList.add('active'); $('#sbDark').classList.remove('active'); };
            $('#sbDark').onclick = () => { $('#sbFrame').contentWindow.postMessage({ type: 'set-scheme', scheme: 'dark' }, '*'); $('#sbDark').classList.add('active'); $('#sbLight').classList.remove('active'); };
            window.addEventListener('message', e => { if (e.data && e.data.type === 'nav-page' && pages.includes(e.data.id)) sel.value = e.data.id; });
          }
          addEventListener('keydown', e => {
            if (e.key === 'Escape') { close(); $('#sbModal').classList.remove('open'); return; }
            if (!$('#lb').classList.contains('open')) return;
            const k = e.key.toLowerCase();
            if (e.key === 'ArrowLeft') nav(-1); else if (e.key === 'ArrowRight') nav(1);
            else if (k === 'c') toggleCompare(); else if (k === 'f') $('#lbimg').classList.toggle('actual');
          });
          </script></body></html>
          END_ALBUM

      - name: Diagnostics and fallback page
        if: always()
        run: |
          mkdir -p site
          {
            echo "=== repo: $REPO ref: $REF subdir: $SUBDIR ==="
            echo "bundle: ${{ steps.bundle.outcome }} | boot: ${{ steps.boot.outcome }} | theme: ${{ steps.theme.outcome }} | ready: ${{ steps.ready.outcome }}"
            tail -n 60 site/build.log 2>/dev/null
          } > site/diagnostics.txt 2>&1 || true

          if [ ! -f site/manifest.json ]; then
            echo '<!DOCTYPE html><meta charset="utf-8"><h1>Preview failed</h1><pre>Xem diagnostics.txt</pre>' > site/index.html
          fi

          ok=false; [ -f site/manifest.json ] && ok=true
          jq -n --arg slug "$SLUG" --arg repo "$REPO" --arg ref "$REF" \
                --arg sha "$(jq -r '.sha // ""' bundle/meta.json 2>/dev/null)" \
                --argjson ok "$ok" '{slug: $slug, repo: $repo, ref: $ref, sha: $sha, ok: $ok}' > site/meta.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-${{ matrix.slug }}
          path: site
          retention-days: 3

  # ====================================================================
  # 3. Deploy GitHub Pages & Auto-Update README.md trên nhánh main
  # ====================================================================
  publish:
    needs: [plan, preview]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out previews branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: previews
          path: tree
          fetch-depth: 1
          persist-credentials: false

      - name: Check out main branch for README update
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo-main
          fetch-depth: 1
          token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: site-*
          path: sites

      - name: Merge previews
        run: |
          mkdir -p tree sites
          cat > publish.mjs <<'END_PUBLISH'
          import fs from 'node:fs';
          import path from 'node:path';

          const KEEP = parseInt(process.env.KEEP_PREVIEWS || '30', 10);
          const readJson = (p, d) => {
            try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return d; }
          };
          const regPath = 'tree/registry.json';
          let registry = readJson(regPath, []);

          for (const dir of fs.readdirSync('sites', { withFileTypes: true })) {
            if (!dir.isDirectory() || !dir.name.startsWith('site-')) continue;
            const slug = dir.name.slice(5);
            if (!/^[a-z0-9-]+$/.test(slug)) continue;
            const src = path.join('sites', dir.name);
            const dst = path.join('tree', slug);
            fs.rmSync(dst, { recursive: true, force: true });
            fs.cpSync(src, dst, { recursive: true, verbatimSymlinks: true });

            const m = readJson(path.join(dst, 'meta.json'), {});
            const mf = readJson(path.join(dst, 'manifest.json'), null);
            const first = mf && mf.items.find(i => i.id === 'login' && i.device === 'desktop' && i.scheme === 'light')
              || (mf && mf.items[0]);
            const entry = {
              slug,
              repo: m.repo || '',
              ref: m.ref || '',
              sha: m.sha || '',
              ok: !!m.ok,
              title: mf ? (mf.meta.title || mf.meta.name || m.repo) : m.repo,
              model: mf ? mf.meta.model : '',
              total: mf ? mf.summary.total : 0,
              errors: mf ? mf.summary.errors : 0,
              warns: mf ? mf.summary.warns : 0,
              sizeKB: mf ? mf.meta.assetSizeKB : 0,
              loadMs: mf ? mf.meta.avgLoadMs : 0,
              thumb: first ? slug + '/' + first.thumb : '',
              updated: new Date().toISOString(),
            };
            registry = registry.filter(r => r.slug !== slug);
            registry.push(entry);
          }

          registry.sort((a, b) => b.updated.localeCompare(a.updated));
          for (const r of registry.slice(KEEP)) {
            fs.rmSync(path.join('tree', r.slug), { recursive: true, force: true });
          }
          registry = registry.slice(0, KEEP);
          fs.writeFileSync(regPath, JSON.stringify(registry));

          const html = `<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="color-scheme" content="light dark">
          <title>LuCI theme previews V2.6</title>
          <style>
          :root{--bg:#fef7ff;--sf:#f3edf7;--fg:#1d1b20;--mut:#49454f;--pri:#6750a4;--bd:#cac4d0;--warn:#b26a00;--err:#b3261e}
          @media(prefers-color-scheme:dark){:root{--bg:#141218;--sf:#211f26;--fg:#e6e0e9;--mut:#cac4d0;--pri:#d0bcff;--onpri:#381e72;--bd:#49454f;--warn:#ffb951;--err:#f2b8b5}}
          *{box-sizing:border-box}
          body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
          h1{font-size:22px;margin:0 0 4px}
          p.sub{color:var(--mut);margin:0 0 18px}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
          a.card{display:block;background:var(--sf);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;border:2px solid transparent}
          a.card:hover{border-color:var(--pri)}
          .card img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;display:block;background:var(--bd)}
          .noimg{aspect-ratio:4/3;display:grid;place-items:center;background:var(--bd);color:var(--mut)}
          .body{padding:10px 14px}
          .body b{display:block}
          .body small{color:var(--mut)}
          .e{color:var(--err);font-weight:700}
          .w{color:var(--warn);font-weight:700}
          </style></head><body>
          <h1>LuCI theme previews V2.6</h1>
          <p class="sub">Chụp Retina 2x & Giả lập tương tác LuCI trên Xiaomi CR6608</p>
          <div class="grid" id="g"></div>
          <script>
          const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          fetch('registry.json').then(r => r.json()).then(list => {
            document.getElementById('g').innerHTML = list.map(r => \`<a class="card" href="\${esc(r.slug)}/">
              \${r.thumb ? '<img loading="lazy" src="' + esc(r.thumb) + '" alt="">' : '<div class="noimg">Không có ảnh</div>'}
              <div class="body"><b>\${esc(r.title || r.repo)}</b>
              <small>\${esc(r.repo)}\${r.ref ? ' @ ' + esc(r.ref.slice(0, 20)) : ''}</small><br>
              <small>\${r.ok ? r.total + ' ảnh · ' + (r.sizeKB || 0) + 'KB · ' + (r.loadMs || 0) + 'ms · <span class="e">' + r.errors + ' lỗi</span> · <span class="w">' + r.warns + ' cảnh báo</span>' : '<span class="e">Không dựng được preview</span>'}</small><br>
              <small>\${new Date(r.updated).toLocaleString('vi-VN')}</small></div></a>\`).join('') || '<p>Chưa có preview nào.</p>';
          });
          <\/script></body></html>`;
          fs.writeFileSync('tree/index.html', html);
          fs.writeFileSync('tree/.nojekyll', '');
          END_PUBLISH
          node publish.mjs

      - name: Save previews branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tree
          rm -rf .git
          git init -q -b previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update previews V2.6 ($(date -u +%FT%TZ))"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin previews

      - name: Prepare Pages directory
        run: |
          mkdir -p deploy
          cp -a tree/. deploy/
          rm -rf deploy/.git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Auto-update README.md on main branch
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node -e '
          const fs = require("fs");
          let reg = [];
          try { reg = JSON.parse(fs.readFileSync("tree/registry.json", "utf8")); } catch {}
          const base = (process.env.PAGE_URL || "").replace(/\/+$/, "") + "/";

          let rows = reg.map(r => {
            const link = `[${r.repo}](https://github.com/${r.repo})`;
            const status = r.ok ? `✅ ${r.total} ảnh` : `❌ Lỗi`;
            const stats = r.ok ? `${r.sizeKB || 0} KB · ${r.loadMs || 0} ms` : `-`;
            const issues = r.ok ? `${r.errors} lỗi / ${r.warns} cảnh báo` : `-`;
            const preview = `[Xem Live & Sandbox](${base}${r.slug}/)`;
            const date = new Date(r.updated).toLocaleDateString("vi-VN");
            return `| ${link} | ${status} | ${stats} | ${issues} | ${preview} | ${date} |`;
          }).join("\n");

          if (!rows) rows = "| *Chưa có theme nào được test* | - | - | - | - | - |";

          const readme = `# LuCI Theme Preview V2.6

          Hệ thống tự động dựng môi trường OpenWrt giả lập phần cứng **Xiaomi Mi Router CR6608** (MediaTek MT7621, RAM 256MB), tự động nhận diện/giải nén theme LuCI (Source, Rootfs Overlay, \`.ipk\`), chụp ảnh chuẩn **Retina 2x** và xuất bản **Interactive Sandbox** lên GitHub Pages.

          🌐 **Trang tổng hợp tất cả Preview:** ${base}

          ## Cách sử dụng
          1. Mở tab **Actions** $\\rightarrow$ chọn **Preview LuCI themes V2.6 (Link-Only · Auto-README)**.
          2. Bấm **Run workflow**, dán link GitHub của theme cần test (ví dụ: \`jerrykuku/luci-theme-argon\` hoặc \`peditx/luci-theme-peditx\`).
          3. Chờ hoàn tất, bảng bên dưới sẽ tự động cập nhật kết quả mới nhất.

          ## Danh sách Theme đã kiểm thử gần đây

          | Repository | Trạng thái | Tài nguyên / Tốc độ | Kiểm tra UI/UX | Preview & Sandbox | Cập nhật |
          |---|---|---|---|---|---|
          ${rows}
          `.replace(/^          /gm, "");

          fs.writeFileSync("repo-main/README.md", readme);
          '
          cd repo-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "docs: auto-update preview table in README.md"
            git push origin main
          fi
