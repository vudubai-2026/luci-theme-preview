<script>

window.L = window.L || {
  env: { requestpath: [], mediaurlbase: "assets/luci-static" },
  uci: { get: () => null, sections: () => [], load: async () => ({}) },
  rpc: { declare: () => async () => ({}) },
  ui: { addNotification: (t, m) => console.log(t, m) }
};
const ROUTES = {"/admin/status/overview":"mobile-menu","/admin/status/routes":"routes","/admin/status/logs":"syslog","/admin/status/processes":"processes","/admin/status/realtime":"realtime","/admin/network/network":"iface-modal","/admin/network/wireless":"wireless","/admin/network/dhcp":"dhcp","/admin/network/hosts":"hosts","/admin/network/routes":"static-routes","/admin/network/firewall":"firewall","/admin/network/firewall/forwards":"fw-forwards","/admin/network/firewall/rules":"fw-rules","/admin/network/sqm":"sqm","/admin/network/diagnostics":"diagnostics","/admin/system/system":"dropdown","/admin/system/admin":"admin","/admin/system/package-manager":"packages","/admin/system/startup":"startup","/admin/system/crontab":"crontab","/admin/system/flash":"flash","/admin/services/upnp":"upnp","/admin/services/ddns":"ddns","/admin/services/wol":"wol"};
function resolvePage(href) {
  if (!href) return null;
  for (const [r, targetId] of Object.entries(ROUTES)) {
    if (href.endsWith(r)) return targetId;
  }
  if (href.endsWith("/logout")) return "login";
  return null;
}
document.addEventListener("click", e => {
  const link = e.target.closest("a[href], [data-orig-href]");
  if (link) {
    const orig = link.getAttribute("data-orig-href") || link.getAttribute("href") || "";
    const targetId = resolvePage(orig);
    e.preventDefault();
    e.stopPropagation();
    if (targetId) {
      window.parent.postMessage({ type: "nav-page", id: targetId }, "*");
      location.href = targetId + ".html";
    } else {
      // Mở menu con nếu click vào mục cha trên thanh điều hướng
      const parentLi = link.closest("li");
      if (parentLi) parentLi.classList.toggle("active");
    }
    return;
  }
  const tab = e.target.closest(".tabs > li, .cbi-tabmenu > li");
  if (tab && tab.parentElement) {
    e.preventDefault();
    [...tab.parentElement.children].forEach(li => li.classList.remove("active", "cbi-tab"));
    tab.classList.add("active", "cbi-tab");
    const idx = [...tab.parentElement.children].indexOf(tab);
    const box = tab.closest(".cbi-map, .cbi-section, #maincontent");
    const panes = box ? box.querySelectorAll("[data-tab]") : [];
    panes.forEach((p, i) => p.style.display = i === idx ? "block" : "none");
  }
  const toggle = e.target.closest(".menu-toggle, .showSide, #menu-toggle, [aria-label*=\"menu\" i]");
  if (toggle) {
    e.preventDefault();
    document.body.classList.toggle("menu-open");
    const nav = document.querySelector(".main-left, nav, aside, .nav");
    if (nav) nav.classList.toggle("active");
  }
}, true);
window.addEventListener("message", e => {
  if (e.data && e.data.type === "set-scheme") {
    document.documentElement.setAttribute("data-theme", e.data.scheme);
    document.documentElement.style.colorScheme = e.data.scheme;
  }
});
